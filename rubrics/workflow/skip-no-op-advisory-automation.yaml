schema_version: 1
id: skip-no-op-advisory-automation
title: Skip no-op advisory automation
description: >-
  When an advisory automation lane has no meaningful input to score, review, or
  act on, skip expensive model/runtime work and avoid posting user-facing
  no-op comments. Prefer a concise workflow notice or summary that explains the
  skip, while leaving explicit initialization or recovery routes unchanged.
type: generic
domain: coding_workflow
applies_to:
  - implement
  - fix-pr
  - review
severity: should
weight: 7
status: active
examples:
  - source: https://github.com/self-evolving/repo/issues/410
    note: >-
      The requester asked whether rubrics-review should be skipped when there
      are no rubrics or no rubrics branch, rather than spending a model run to
      post an N/A comment.
  - source: https://github.com/self-evolving/repo/issues/410#issuecomment-4625815720
    note: >-
      The requester approved orchestrating the small workflow/docs/test change
      after the proposed approach kept initialization separate and skipped
      normal review-path comments when nothing was scoreable.
