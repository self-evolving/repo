schema_version: 1
id: leave-release-notes-to-release-preparation
title: Leave release notes to release preparation
description: >-
  When a repository uses a dedicated release-preparation flow, do not add or
  edit release notes in ordinary implementation or fix pull requests. Treat the
  pull request description as the per-change record and leave release-note
  drafting and aggregation to the release flow; during review, flag release-note
  edits outside explicit release work.
type: generic
domain: coding_workflow
applies_to:
  - implement
  - fix-pr
  - review
severity: must
weight: 8
status: active
examples:
  - source: https://github.com/self-evolving/repo/pull/477#issuecomment-5010414572
    note: >-
      The maintainer directed the fix pass to keep only the contributor-guidance
      rule against normal PR release-note edits and to revert the broader
      changelog-policy changes.
