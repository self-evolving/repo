schema_version: 1
id: prefer-markdown-for-simple-command-issues
title: Prefer Markdown for simple command issues
description: >-
  When creating or changing user-facing issue templates for simple agent command
  flows, prefer Markdown templates that open an editable prefilled issue body.
  Reserve YAML issue forms for cases that genuinely need required fields,
  typed inputs, dropdowns, or structured validation.
type: generic
domain: coding_workflow
applies_to:
  - implement
  - fix-pr
  - review
severity: should
weight: 6
status: active
examples:
  - source: https://github.com/self-evolving/repo/issues/395#issuecomment-4607125063
    note: >-
      The requester framed a reusable rule of thumb: simple Sepo command issues
      should default to Markdown templates, while YAML forms are for structured
      validation.
  - source: https://github.com/self-evolving/repo/issues/395#issuecomment-4607189267
    note: >-
      The requester endorsed simplifying the templates based on the Markdown
      versus YAML distinction before PR #405 implemented that direction.
