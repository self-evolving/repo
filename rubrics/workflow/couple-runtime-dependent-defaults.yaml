schema_version: 1
id: couple-runtime-dependent-defaults
title: Couple runtime-dependent defaults
description: >-
  When a default, registry, or policy value can select behavior that depends on
  the installed agent runtime, adapter, or tool version, prefer a bundled or
  reviewed update path that keeps the value coupled to compatible runtime code.
  Avoid live per-run remote fetches for those defaults unless the design also
  has an explicit compatibility, fallback, and review contract.
type: generic
domain: coding_workflow
applies_to:
  - implement
  - fix-pr
  - review
severity: should
weight: 8
status: active
examples:
  - source: https://github.com/self-evolving/repo/pull/401
    note: >-
      The PR deliberately chose bundled model defaults over a remote per-run
      registry so model bumps stay coupled to reviewed agent runtime updates.
