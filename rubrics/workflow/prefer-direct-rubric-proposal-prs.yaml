schema_version: 1
id: prefer-direct-rubric-proposal-prs
title: Prefer direct rubric proposal PRs
description: >-
  When a user asks Sepo to propose user/team rubric updates, prefer opening or
  updating the reviewable proposal PR against the rubrics branch directly.
  Avoid creating a separate intermediate tracking issue solely to start the
  rubric proposal flow unless the user explicitly asks for issue-backed
  tracking or the workflow needs a distinct approval gate.
type: specific
domain: coding_workflow
applies_to:
  - add-rubrics
  - implement
  - fix-pr
  - review
severity: should
weight: 7
status: active
examples:
  - source: https://github.com/self-evolving/repo/pull/425#pullrequestreview-4512236902
    note: >-
      The requester said a separate issue to track rubric creation was too
      excessive and suggested creating the rubric proposal PR directly.
