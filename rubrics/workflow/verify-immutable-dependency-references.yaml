schema_version: 1
id: verify-immutable-dependency-references
title: Verify immutable dependency references
description: >-
  When adding or updating immutable references to external dependencies, such
  as action commit SHAs, image digests, or version-specific hashes, verify each
  value against the authoritative upstream source at implementation time and
  confirm that it identifies the intended release. During review, independently
  re-check changed references instead of trusting agent-generated values,
  adjacent version labels, or previously valid pins that may now be stale or
  mismatched.
type: generic
domain: coding_workflow
applies_to:
  - implement
  - fix-pr
  - review
severity: should
weight: 8
status: active
examples:
  - source: https://github.com/self-evolving/repo/pull/475#issuecomment-4955023068
    note: >-
      The requester asked implementation and review agents to double-check
      agent-generated hashes for static version identifiers because they can be
      outdated and leave stale references.
