name: Setup Agent Runtime
description: |
  Check out-independent runtime bootstrap for the Sepo agent.
  Reuses preinstalled Node.js on self-hosted runners, installs Node.js on
  GitHub-hosted runners, then builds the TypeScript runtime in place and
  optionally installs missing agent CLIs.

inputs:
  node_version:
    description: Node.js version to install.
    required: false
    default: "22"
  install_codex:
    description: Whether to install the Codex CLI when missing.
    required: false
    default: "false"
  codex_version:
    description: Optional @openai/codex version to install when the CLI is missing.
    required: false
    default: ""
  install_claude:
    description: Whether to install the Claude CLI when missing.
    required: false
    default: "false"
  claude_version:
    description: Optional Claude Code version to install when the CLI is missing.
    required: false
    default: ""
  cache_mode:
    description: >-
      Runtime and CLI caching: "off" preserves today's unconditional npm ci
      + build and disables CLI restore/save; "modules" restores
      .agent/node_modules keyed by the manifest and lockfile hashes and skips
      npm ci on an exact hit; "full" additionally restores .agent/dist keyed
      by the source tree, tsconfig, and manifest hashes and skips the
      TypeScript build on an exact hit. Both cached modes also restore/save a
      missing Claude CLI, keyed exactly when pinned and by ISO week when
      unpinned. Codex is supplied by the locked runtime dependencies and is
      covered by the modules cache instead of a duplicate global cache.
      Exact-key hits only — relevant source, manifest, lockfile, action, or
      model-default changes fall back to the uncached path. Only "off",
      "modules", and "full" are accepted; any other value fails setup with a
      clear error. Defaults to "full".
    required: false
    default: "full"

runs:
  using: composite
  steps:
    - name: Ensure Node.js available on GitHub-hosted runners
      if: ${{ runner.environment != 'self-hosted' }}
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ inputs.node_version }}

    - name: Verify preinstalled Node.js on self-hosted runners
      if: ${{ runner.environment == 'self-hosted' }}
      shell: bash
      env:
        REQUESTED_NODE_VERSION: ${{ inputs.node_version }}
      run: |
        set -euo pipefail

        missing=()
        for cmd in node npm; do
          if ! command -v "$cmd" >/dev/null 2>&1; then
            missing+=("$cmd")
          fi
        done

        if [ "${#missing[@]}" -ne 0 ]; then
          echo "Self-hosted runner is missing required Node.js tools: ${missing[*]}" >&2
          echo "Install a compatible Node.js runtime on the runner or switch to a GitHub-hosted runner." >&2
          exit 1
        fi

        installed_node="$(node -p 'process.versions.node')"
        installed_npm="$(npm --version)"
        requested_major="$(printf '%s' "$REQUESTED_NODE_VERSION" | sed -nE 's/^v?([0-9]+).*/\1/p')"
        installed_major="${installed_node%%.*}"

        if [ -n "$requested_major" ] && [ "$installed_major" != "$requested_major" ]; then
          echo "Self-hosted runner has Node.js ${installed_node}, but setup-agent-runtime requires major version ${requested_major}.x." >&2
          exit 1
        fi

        echo "Using preinstalled Node.js ${installed_node} and npm ${installed_npm} on self-hosted runner."

    - name: Add runtime tool bins to PATH
      shell: bash
      run: |
        echo "$GITHUB_WORKSPACE/.agent/node_modules/.bin" >> "$GITHUB_PATH"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        echo "NODE_PATH=$GITHUB_WORKSPACE/.agent/node_modules${NODE_PATH:+:$NODE_PATH}" >> "$GITHUB_ENV"

    - name: Validate cache mode
      if: ${{ inputs.cache_mode != 'off' && inputs.cache_mode != 'modules' && inputs.cache_mode != 'full' }}
      shell: bash
      env:
        CACHE_MODE_INPUT: ${{ inputs.cache_mode }}
      run: |
        echo "::error title=Invalid cache_mode::cache_mode must be one of: off, modules, full; got '${CACHE_MODE_INPUT}'."
        exit 1

    - name: Compute runtime cache keys
      if: ${{ inputs.cache_mode != 'off' }}
      id: keys
      shell: bash
      run: |
        # The resolved runtime ABI (not the requested selector or exact
        # version) keys the modules cache: native addons are ABI-tied to
        # what actually runs, and ABI-compatible patch updates should keep
        # the cache warm. Hashing the action file itself fingerprints the
        # producer, so changes to how artifacts are built rotate the keys.
        # The dist source fingerprint is the git tree ID of .agent/src —
        # unlike hashFiles, tree IDs encode file paths, so a
        # content-preserving rename rotates the key instead of serving a
        # dist compiled for the old paths. No caller-supplied inputs are
        # interpolated into this script.
        resolved_node_abi="$(node -p 'process.versions.modules')"
        src_tree="$(git rev-parse HEAD:.agent/src)"
        echo "modules=sepo-runtime-modules-${{ runner.os }}-${{ runner.arch }}-nodeabi${resolved_node_abi}-${{ hashFiles('.agent/package.json', '.agent/package-lock.json', '.github/actions/setup-agent-runtime/action.yml') }}" >> "$GITHUB_OUTPUT"
        echo "dist=sepo-runtime-dist-${{ runner.os }}-${{ runner.arch }}-src${src_tree}-${{ hashFiles('.agent/tsconfig.json', '.agent/package.json', '.agent/package-lock.json', '.github/actions/setup-agent-runtime/action.yml') }}" >> "$GITHUB_OUTPUT"

    # restore/save are split deliberately: the combined actions/cache action
    # saves in a post step at job completion, by which point write-capable
    # callers (implement, fix-pr) have switched the workspace to a mutable
    # branch that an approve-all agent may have rebuilt — archiving
    # branch-derived artifacts under a key computed from the default-branch
    # tree. Saving explicitly right after npm ci / build, before control
    # returns to the caller, closes that window.
    - name: Restore runtime dependency cache
      if: ${{ inputs.cache_mode != 'off' }}
      id: cache_modules
      # Best-effort: a failed restore leaves cache-hit unset, so the miss
      # guards below fall through to the unconditional npm ci / build path
      # instead of failing setup outright.
      continue-on-error: true
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .agent/node_modules
        key: ${{ steps.keys.outputs.modules }}

    - name: Restore built runtime cache
      if: ${{ inputs.cache_mode == 'full' }}
      id: cache_dist
      continue-on-error: true
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .agent/dist
        key: ${{ steps.keys.outputs.dist }}

    - name: Install runtime dependencies
      if: ${{ inputs.cache_mode == 'off' || steps.cache_modules.outputs.cache-hit != 'true' }}
      shell: bash
      working-directory: .agent
      run: npm ci

    - name: Save runtime dependency cache
      if: ${{ inputs.cache_mode != 'off' && steps.cache_modules.outputs.cache-hit != 'true' }}
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .agent/node_modules
        key: ${{ steps.keys.outputs.modules }}

    - name: Build runtime
      if: ${{ inputs.cache_mode != 'full' || steps.cache_dist.outputs.cache-hit != 'true' }}
      shell: bash
      working-directory: .agent
      run: npm run build

    - name: Save built runtime cache
      if: ${{ inputs.cache_mode == 'full' && steps.cache_dist.outputs.cache-hit != 'true' }}
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .agent/dist
        key: ${{ steps.keys.outputs.dist }}

    - name: Verify base runner tools
      shell: bash
      run: |
        missing=()
        for cmd in git gh jq bash; do
          if ! command -v "$cmd" >/dev/null 2>&1; then
            missing+=("$cmd")
          fi
        done

        if [ "${#missing[@]}" -ne 0 ]; then
          echo "Missing required runner tools: ${missing[*]}" >&2
          exit 1
        fi

    # A missing standalone Claude CLI gets the same exact-key cache treatment
    # as the runtime: best-effort restore, immediate miss-gated save, never a
    # post-job save. Mutable channels key on an ISO-week bucket; pinned
    # versions key exactly. The compatibility fingerprint covers the
    # producer action, the adapter lock state, and the bundled model
    # defaults: pinned model IDs and adapter versions set a floor the
    # cached CLI must satisfy that the execution probe cannot detect. Every
    # rotation source is warmed by the seed workflow (runtime pushes and
    # the weekly schedule aligned to the bucket), so rotation does not put
    # downloads on user-facing runs.
    # Preinstalled CLIs (self-hosted runners) skip the cache entirely.
    # Codex already arrives through codex-acp in .agent/node_modules, so the
    # runtime dependency cache owns it rather than an unreachable second cache.
    - name: Resolve Claude CLI cache key
      # runner.environment enforces the scope contract below: self-hosted
      # runners never touch this cache, whether or not the CLI is
      # preinstalled — a missing CLI there still installs fresh, uncached.
      if: ${{ inputs.cache_mode != 'off' && inputs.install_claude == 'true' && runner.environment != 'self-hosted' }}
      id: cli
      shell: bash
      env:
        INSTALL_CLAUDE: ${{ inputs.install_claude }}
        CLAUDE_VERSION: ${{ inputs.claude_version }}
      run: |
        week="$(date -u +%G-%V)"
        need_claude=false
        if [ "${INSTALL_CLAUDE}" = "true" ] && ! command -v claude >/dev/null 2>&1; then
          need_claude=true
        fi
        # Mutable installer channels (empty, latest, stable) rotate on the
        # ISO-week bucket; anything else is treated as an exact pin.
        case "${CLAUDE_VERSION}" in
          ""|latest|stable) channel="${CLAUDE_VERSION:-latest}-${week}" ;;
          *) channel="${CLAUDE_VERSION}" ;;
        esac
        if [ "${need_claude}" = "true" ] && [ -z "${DISABLE_AUTOUPDATER:-}" ]; then
          # Action-managed installs must not self-update: the version probe
          # is one launch and the agent run is the next, so background
          # updates would race the run, silently advance pinned versions,
          # and be re-downloaded on every immutable cache hit. Per Anthropic
          # docs this also disables plugin/marketplace auto-updates — the
          # right default for ephemeral CI determinism; operators can set
          # FORCE_AUTOUPDATE_PLUGINS=1 to restore plugin updates, and any
          # pre-set DISABLE_AUTOUPDATER value is preserved untouched.
          # Preinstalled self-hosted CLIs keep their operator's policy.
          echo "DISABLE_AUTOUPDATER=1" >> "$GITHUB_ENV"
        fi
        {
          echo "need_claude=${need_claude}"
          echo "claude_key=sepo-cli-claude-${{ runner.os }}-${{ runner.arch }}-${channel}-${{ hashFiles('.github/actions/setup-agent-runtime/action.yml', '.agent/package-lock.json', '.agent/model-defaults.json') }}"
        } >> "$GITHUB_OUTPUT"

    # Scope contract: this cache targets the uniform GitHub-hosted runner
    # fleet — one HOME/workspace geometry and one libc per os/arch pair —
    # which is where the CLI download cost lives, so runner.os/arch keys
    # and HOME-scoped paths are exact within scope. Self-hosted pools are
    # expected to preinstall the CLI (the need check then bypasses caching
    # entirely), and outside the contract — exotic layouts, musl, Rosetta —
    # the execution probe below rejects any incompatible restore and falls
    # back to a fresh install, so the worst case anywhere is the uncached
    # status quo, never a broken CLI.
    - name: Restore Claude CLI cache
      if: ${{ steps.cli.outputs.need_claude == 'true' }}
      id: cli_claude
      continue-on-error: true
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.local/bin/claude
          ~/.local/share/claude
        key: ${{ steps.cli.outputs.claude_key }}

    - name: Install Codex CLI
      if: ${{ inputs.install_codex == 'true' }}
      shell: bash
      env:
        CODEX_VERSION: ${{ inputs.codex_version }}
      run: |
        if command -v codex >/dev/null 2>&1; then
          echo "Codex CLI already available."
          exit 0
        fi

        pkg="@openai/codex"
        if [ -n "$CODEX_VERSION" ]; then
          pkg="$pkg@$CODEX_VERSION"
        fi

        npm install -g "$pkg"
        echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"

    - name: Install Claude CLI
      if: ${{ inputs.install_claude == 'true' }}
      shell: bash
      env:
        CLAUDE_VERSION: ${{ inputs.claude_version }}
      run: |
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        if claude --version >/dev/null 2>&1 || "$HOME/.local/bin/claude" --version >/dev/null 2>&1; then
          echo "Claude CLI already available."
          exit 0
        fi

        if [ -n "$CLAUDE_VERSION" ]; then
          curl -fsSL https://claude.ai/install.sh | bash -s -- "$CLAUDE_VERSION"
        else
          curl -fsSL https://claude.ai/install.sh | bash
        fi

    - name: Save Claude CLI cache
      if: ${{ steps.cli.outputs.need_claude == 'true' && steps.cli_claude.outputs.cache-hit != 'true' }}
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.local/bin/claude
          ~/.local/share/claude
        key: ${{ steps.cli.outputs.claude_key }}
