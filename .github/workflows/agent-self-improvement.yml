name: Agent / Self Improvement

on:
  schedule:
    - cron: "23 */6 * * *" # Every 6 hours at minute 23 UTC
  workflow_dispatch:
    inputs:
      instructions:
        description: "Optional extra steering for this self-improvement run."
        required: false
        default: ""

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write
  id-token: write # required for GitHub Actions OIDC broker exchange

concurrency:
  group: agent-self-improvement-${{ github.repository }}
  cancel-in-progress: false

jobs:
  gate:
    if: vars.AGENT_ENABLED != 'false' && vars.AGENT_SELF_IMPROVEMENT_ENABLED == 'true'
    runs-on: ${{ fromJson(vars.AGENT_RUNS_ON || '["ubuntu-latest"]') }}
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
      mode: ${{ steps.gate.outputs.mode }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ github.token }}

      - name: Resolve scheduled activity gate
        id: gate
        uses: ./.github/actions/scheduled-activity-gate
        with:
          github_token: ${{ github.token }}
          schedule_policy: ${{ vars.AGENT_SCHEDULE_POLICY || '' }}
          workflow: agent-self-improvement.yml

  plan:
    needs: gate
    if: vars.AGENT_ENABLED != 'false' && needs.gate.outputs.skip != 'true'
    runs-on: ${{ fromJson(vars.AGENT_RUNS_ON || '["ubuntu-latest"]') }}
    permissions:
      actions: read
      contents: read
      discussions: read
      issues: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ github.token }}

      - name: Resolve self-improvement provider
        id: provider
        uses: ./.github/actions/resolve-agent-provider
        with:
          route: answer
          default_provider: ${{ vars.AGENT_DEFAULT_PROVIDER || 'auto' }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          claude_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model_policy: ${{ vars.AGENT_MODEL_POLICY || '' }}

      - name: Setup selected provider
        uses: ./.github/actions/setup-agent-runtime
        with:
          install_codex: ${{ steps.provider.outputs.install_codex }}
          install_claude: ${{ steps.provider.outputs.install_claude }}

      - name: Resolve task timeout
        id: task_timeout
        env:
          AGENT_TASK_TIMEOUT_POLICY: ${{ vars.AGENT_TASK_TIMEOUT_POLICY || '' }}
          ROUTE: answer
        run: node .agent/dist/cli/resolve-task-timeout.js

      - name: Plan self-improvement decision
        id: planner
        timeout-minutes: ${{ fromJson(steps.task_timeout.outputs.minutes || '30') }}
        uses: ./.github/actions/run-agent-task
        with:
          agent: ${{ steps.provider.outputs.provider }}
          github_token: ${{ github.token }}
          secondary_github_token: ${{ secrets.AGENT_SECONDARY_GITHUB_TOKEN }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          claude_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: ${{ steps.provider.outputs.model }}
          display_model: ${{ vars.AGENT_DISPLAY_MODEL || '' }}
          permission_mode: approve-all
          prompt: agent-self-improvement
          route: answer
          lane: self-improvement
          memory_mode_override: read-only
          memory_ref: ${{ vars.AGENT_MEMORY_REF || 'agent/memory' }}
          memory_policy: ${{ vars.AGENT_MEMORY_POLICY || '' }}
          rubrics_mode_override: disabled
          rubrics_ref: ${{ vars.AGENT_RUBRICS_REF || 'agent/rubrics' }}
          rubrics_policy: ${{ vars.AGENT_RUBRICS_POLICY || '' }}
          rubrics_limit: ${{ vars.AGENT_RUBRICS_LIMIT || '10' }}
          session_policy: none
          request_text: |
            Run the liveness-first scheduled self-improvement planner for ${{ github.repository }}.
            Configuration:
            - repository: ${{ github.repository }}
            - event: ${{ github.event_name }}
            - workflow schedule: every 6 hours at minute 23 UTC
            - scheduled activity gate: ${{ needs.gate.outputs.mode }} (${{ needs.gate.outputs.reason }})
            - no memory-cursor gate is used
            - no open-proposal backlog gate is used
            - the planner must decide whether to create a new issue, continue an existing issue, or continue an existing PR
            - after validation, deterministic workflow code will create/comment and dispatch agent-orchestrator.yml
            Operator instructions: ${{ github.event_name == 'workflow_dispatch' && inputs.instructions || '' }}
          requested_by: ${{ github.actor }}
          source_kind: workflow_dispatch
          target_kind: repository
          target_number: '0'
          target_url: ${{ github.server_url }}/${{ github.repository }}
          reasoning_effort: ${{ steps.provider.outputs.reasoning_effort || 'xhigh' }}
          workflow: agent-self-improvement.yml

      - name: Upload self-improvement decision
        uses: actions/upload-artifact@v4
        with:
          name: self-improvement-decision-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.planner.outputs.response_file }}
          retention-days: 1

  apply-and-dispatch:
    needs: plan
    if: vars.AGENT_ENABLED != 'false' && needs.plan.result == 'success'
    runs-on: ${{ fromJson(vars.AGENT_RUNS_ON || '["ubuntu-latest"]') }}
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ github.token }}

      - name: Resolve GitHub auth
        id: auth
        uses: ./.github/actions/resolve-github-auth
        with:
          app_id: ${{ secrets.AGENT_APP_ID }}
          app_private_key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          pat: ${{ secrets.AGENT_PAT }}
          fallback_token: ${{ github.token }}

      - name: Setup agent runtime
        uses: ./.github/actions/setup-agent-runtime

      - name: Resolve self-improvement requester
        id: requester
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY_OWNER_TYPE: ${{ github.event.repository.owner.type }}
        run: node .agent/dist/cli/resolve-self-improvement-requester.js

      - name: Download self-improvement decision
        uses: actions/download-artifact@v4
        with:
          name: self-improvement-decision-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/self-improvement-decision

      - name: Locate decision response
        id: decision_response
        shell: bash
        env:
          DECISION_DIR: ${{ runner.temp }}/self-improvement-decision
        run: |
          set -euo pipefail
          response_file="$(find "$DECISION_DIR" -type f -name '*.md' -print -quit)"
          if [ -z "$response_file" ]; then
            echo "No self-improvement decision markdown artifact found." >&2
            exit 1
          fi
          echo "response_file=${response_file}" >> "$GITHUB_OUTPUT"

      - name: Apply decision and dispatch orchestrator
        id: apply
        env:
          ACCESS_POLICY: ${{ vars.AGENT_ACCESS_POLICY || '' }}
          AGENT_ALLOW_SELF_APPROVE: ${{ vars.AGENT_ALLOW_SELF_APPROVE || 'false' }}
          AGENT_ALLOW_SELF_MERGE: ${{ vars.AGENT_ALLOW_SELF_MERGE || 'false' }}
          AUTHOR_ASSOCIATION: ${{ steps.requester.outputs.author_association }}
          AUTOMATION_MAX_ROUNDS: ${{ vars.AGENT_AUTOMATION_MAX_ROUNDS || '12' }}
          AUTOMATION_MODE: ${{ vars.AGENT_AUTOMATION_MODE || 'agent' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ steps.auth.outputs.token }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private && 'true' || 'false' }}
          REQUESTED_BY: ${{ steps.requester.outputs.requested_by }}
          RESPONSE_FILE: ${{ steps.decision_response.outputs.response_file }}
          SESSION_BUNDLE_MODE: ${{ vars.AGENT_SESSION_BUNDLE_MODE || 'auto' }}
        run: node .agent/dist/cli/apply-self-improvement-decision.js

      - name: Write decision summary
        if: always() && steps.apply.outcome == 'success'
        run: |
          {
            echo "### Self-improvement dispatch"
            echo ""
            echo "- Decision: \`${{ steps.apply.outputs.decision }}\`"
            echo "- Target: \`${{ steps.apply.outputs.target_kind }} #${{ steps.apply.outputs.target_number }}\`"
            if [ -n "${{ steps.apply.outputs.issue_url }}" ]; then
              echo "- Created issue: ${{ steps.apply.outputs.issue_url }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
