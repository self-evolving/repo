name: Agent / Rubrics / Add

on:
  workflow_call:
    inputs:
      target_number:
        description: "Target issue, PR, or discussion number"
        required: true
        type: string
      target_url:
        description: "Target URL"
        required: true
        type: string
      target_kind:
        description: "Target kind (issue, pull_request, discussion)"
        required: true
        type: string
      source_kind:
        description: "Trigger source kind"
        required: false
        default: workflow_dispatch
        type: string
      response_kind:
        description: "Response surface kind"
        required: false
        default: issue_comment
        type: string
      review_comment_id:
        description: "Review comment id for reply surfaces"
        required: false
        default: ""
        type: string
      discussion_id:
        description: "Discussion node id for discussion replies"
        required: false
        default: ""
        type: string
      reply_to_id:
        description: "Optional reply-to id for threaded comments"
        required: false
        default: ""
        type: string
      request_text:
        description: "Original user request text"
        required: false
        default: ""
        type: string
      requested_by:
        description: "GitHub login that requested the run"
        required: false
        default: ""
        type: string
      rubrics_ref:
        description: "Rubrics branch to propose changes against"
        required: false
        default: agent/rubrics
        type: string
      runs_on:
        description: "Runner labels as JSON array"
        required: false
        default: ""
        type: string
      session_bundle_mode:
        description: "Session bundle mode (auto, always, never)"
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      target_number:
        description: "Target issue, PR, or discussion number"
        required: true
      target_url:
        description: "Target URL"
        required: true
      target_kind:
        description: "Target kind (issue, pull_request, discussion)"
        required: true
      source_kind:
        description: "Trigger source kind"
        required: false
        default: workflow_dispatch
      response_kind:
        description: "Response surface kind"
        required: false
        default: issue_comment
      request_text:
        description: "Original user request text"
        required: false
        default: ""
      requested_by:
        description: "GitHub login that requested the run"
        required: false
        default: ""
      rubrics_ref:
        description: "Rubrics branch to propose changes against"
        required: false
        default: agent/rubrics

permissions:
  contents: write
  discussions: write
  issues: write
  pull-requests: write
  id-token: write # required for GitHub Actions OIDC broker exchange

concurrency:
  group: agent-add-rubrics-${{ github.repository }}-${{ inputs.target_kind }}-${{ inputs.target_number }}
  cancel-in-progress: false

jobs:
  add-rubrics:
    if: vars.AGENT_ENABLED != 'false'
    runs-on: ${{ fromJson(inputs.runs_on || vars.AGENT_RUNS_ON || '["ubuntu-latest"]') }}
    outputs:
      add_rubrics_outcome: ${{ steps.add_rubrics.outcome }}
      rubrics_available: ${{ steps.add_rubrics.outputs.rubrics_available }}
    env:
      TARGET_NUMBER: ${{ inputs.target_number }}
      TARGET_URL: ${{ inputs.target_url }}
      TARGET_KIND: ${{ inputs.target_kind }}
      SOURCE_KIND: ${{ inputs.source_kind }}
      RESPONSE_KIND: ${{ inputs.response_kind }}
      REQUEST_TEXT: ${{ inputs.request_text }}
      REQUESTED_BY: ${{ inputs.requested_by }}
      RUBRICS_REF: ${{ inputs.rubrics_ref || vars.AGENT_RUBRICS_REF || 'agent/rubrics' }}
      REVIEW_COMMENT_ID: ${{ inputs.review_comment_id }}
      DISCUSSION_ID: ${{ inputs.discussion_id }}
      REPLY_TO_ID: ${{ inputs.reply_to_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ github.token }}

      - name: Resolve GitHub auth
        id: auth
        uses: ./.github/actions/resolve-github-auth
        with:
          app_id: ${{ secrets.AGENT_APP_ID }}
          app_private_key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          pat: ${{ secrets.AGENT_PAT }}
          fallback_token: ${{ github.token }}

      - name: Resolve add-rubrics provider
        id: provider
        uses: ./.github/actions/resolve-agent-provider
        with:
          route: add-rubrics
          default_provider: ${{ vars.AGENT_DEFAULT_PROVIDER || 'auto' }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          claude_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model_policy: ${{ vars.AGENT_MODEL_POLICY || '' }}

      - name: Setup agent runtime
        uses: ./.github/actions/setup-agent-runtime
        with:
          install_codex: ${{ steps.provider.outputs.install_codex }}
          install_claude: ${{ steps.provider.outputs.install_claude }}

      - name: Resolve task timeout
        id: task_timeout
        env:
          AGENT_TASK_TIMEOUT_POLICY: ${{ vars.AGENT_TASK_TIMEOUT_POLICY || '' }}
          ROUTE: add-rubrics
        run: node .agent/dist/cli/resolve-task-timeout.js

      - name: Propose rubric edits
        id: add_rubrics
        timeout-minutes: ${{ fromJson(steps.task_timeout.outputs.minutes || '30') }}
        uses: ./.github/actions/run-agent-task
        with:
          agent: ${{ steps.provider.outputs.provider }}
          github_token: ${{ steps.auth.outputs.token }}
          agent_github_token: ${{ secrets.AGENT_SECONDARY_GITHUB_TOKEN }}
          expose_github_token_to_agent: "false"
          secondary_github_token: ${{ secrets.AGENT_SECONDARY_GITHUB_TOKEN }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          claude_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: ${{ steps.provider.outputs.model }}
          display_model: ${{ vars.AGENT_DISPLAY_MODEL || '' }}
          reasoning_effort: ${{ steps.provider.outputs.reasoning_effort || 'medium' }}
          permission_mode: approve-all
          prompt: add-rubrics
          route: add-rubrics
          lane: add-rubrics
          memory_mode_override: read-only
          memory_ref: ${{ vars.AGENT_MEMORY_REF || 'agent/memory' }}
          memory_persist_credentials: "false"
          memory_policy: ${{ vars.AGENT_MEMORY_POLICY || '' }}
          rubrics_mode_override: read-only
          rubrics_ref: ${{ env.RUBRICS_REF }}
          rubrics_persist_credentials: "false"
          rubrics_policy: ${{ vars.AGENT_RUBRICS_POLICY || '' }}
          rubrics_limit: ${{ vars.AGENT_RUBRICS_LIMIT || '10' }}
          session_policy: none
          session_bundle_mode: ${{ inputs.session_bundle_mode || vars.AGENT_SESSION_BUNDLE_MODE || 'auto' }}
          request_text: ${{ env.REQUEST_TEXT }}
          requested_by: ${{ env.REQUESTED_BY || github.actor }}
          source_kind: ${{ env.SOURCE_KIND }}
          target_kind: ${{ env.TARGET_KIND }}
          target_number: ${{ env.TARGET_NUMBER }}
          target_url: ${{ env.TARGET_URL }}
          workflow: agent-add-rubrics.yml

      - name: Prepare add-rubrics handoff artifact
        if: always()
        id: handoff
        env:
          HANDOFF_DIR: ${{ runner.temp }}/add-rubrics-handoff
          RESPONSE_FILE: ${{ steps.add_rubrics.outputs.response_file }}
          RUBRICS_AVAILABLE: ${{ steps.add_rubrics.outputs.rubrics_available }}
          RUBRICS_DIR: ${{ steps.add_rubrics.outputs.rubrics_dir }}
        run: |
          set -euo pipefail

          rm -rf "${HANDOFF_DIR}"
          mkdir -p "${HANDOFF_DIR}"
          printf '%s\n' "${RUBRICS_AVAILABLE}" > "${HANDOFF_DIR}/rubrics_available.txt"

          if [ -n "${RESPONSE_FILE}" ] && [ -f "${RESPONSE_FILE}" ]; then
            cp "${RESPONSE_FILE}" "${HANDOFF_DIR}/response.md"
          fi

          if [ "${RUBRICS_AVAILABLE}" = "true" ] && [ -n "${RUBRICS_DIR}" ] && [ -d "${RUBRICS_DIR}" ]; then
            tar_entries=()
            if [ -e "${RUBRICS_DIR}/rubrics" ]; then
              tar_entries+=(rubrics)
            fi
            if [ -e "${RUBRICS_DIR}/README.md" ]; then
              tar_entries+=(README.md)
            fi
            if [ "${#tar_entries[@]}" -gt 0 ]; then
              tar -C "${RUBRICS_DIR}" -czf "${HANDOFF_DIR}/rubrics-source.tar.gz" "${tar_entries[@]}"
            fi
          fi

          printf 'handoff_dir=%s\n' "${HANDOFF_DIR}" >> "${GITHUB_OUTPUT}"

      - name: Upload add-rubrics handoff
        if: always() && steps.handoff.outputs.handoff_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: add-rubrics-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.handoff.outputs.handoff_dir }}
          include-hidden-files: true
          retention-days: 1

  add-rubrics-post-process:
    needs: add-rubrics
    if: always() && vars.AGENT_ENABLED != 'false'
    runs-on: ${{ fromJson(inputs.runs_on || vars.AGENT_RUNS_ON || '["ubuntu-latest"]') }}
    env:
      TARGET_NUMBER: ${{ inputs.target_number }}
      TARGET_URL: ${{ inputs.target_url }}
      TARGET_KIND: ${{ inputs.target_kind }}
      SOURCE_KIND: ${{ inputs.source_kind }}
      RESPONSE_KIND: ${{ inputs.response_kind }}
      REQUEST_TEXT: ${{ inputs.request_text }}
      REQUESTED_BY: ${{ inputs.requested_by }}
      RUBRICS_REF: ${{ inputs.rubrics_ref || vars.AGENT_RUBRICS_REF || 'agent/rubrics' }}
      REVIEW_COMMENT_ID: ${{ inputs.review_comment_id }}
      DISCUSSION_ID: ${{ inputs.discussion_id }}
      REPLY_TO_ID: ${{ inputs.reply_to_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ github.token }}

      - name: Resolve GitHub auth
        id: auth
        uses: ./.github/actions/resolve-github-auth
        with:
          app_id: ${{ secrets.AGENT_APP_ID }}
          app_private_key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          pat: ${{ secrets.AGENT_PAT }}
          fallback_token: ${{ github.token }}

      - name: Setup trusted post-processing runtime
        uses: ./.github/actions/setup-agent-runtime

      - name: Download add-rubrics handoff
        uses: actions/download-artifact@v4
        with:
          name: add-rubrics-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/add-rubrics-handoff

      - name: Unpack add-rubrics handoff
        id: handoff
        env:
          HANDOFF_DIR: ${{ runner.temp }}/add-rubrics-handoff
          SOURCE_DIR: ${{ runner.temp }}/add-rubrics-source
        run: |
          set -euo pipefail

          rm -rf "${SOURCE_DIR}"
          mkdir -p "${SOURCE_DIR}"
          if [ -f "${HANDOFF_DIR}/rubrics-source.tar.gz" ]; then
            archive="${HANDOFF_DIR}/rubrics-source.tar.gz"
            entries_file="${SOURCE_DIR}/rubrics-source.entries"

            if tar -tvzf "${archive}" | LC_ALL=C grep -Eq '^[^d-]'; then
              echo "::error title=Invalid add-rubrics handoff::Archive contains links or special files"
              exit 1
            fi

            tar -tzf "${archive}" > "${entries_file}"
            while IFS= read -r entry; do
              case "${entry}" in
                README.md|rubrics|rubrics/*) ;;
                *)
                  echo "::error title=Invalid add-rubrics handoff::Unexpected archive entry: ${entry}"
                  exit 1
                  ;;
              esac

              case "/${entry}/" in
                *"/../"*|*"/./"*|*"/.git/"*)
                  echo "::error title=Invalid add-rubrics handoff::Unsafe archive entry: ${entry}"
                  exit 1
                  ;;
              esac
            done < "${entries_file}"
            rm -f "${entries_file}"

            tar -xzf "${archive}" -C "${SOURCE_DIR}"
          fi

          response_file=""
          if [ -f "${HANDOFF_DIR}/response.md" ]; then
            response_file="${HANDOFF_DIR}/response.md"
          fi

          printf 'source_dir=%s\n' "${SOURCE_DIR}" >> "${GITHUB_OUTPUT}"
          printf 'response_file=%s\n' "${response_file}" >> "${GITHUB_OUTPUT}"

      - name: Setup proposal branch
        id: proposal
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REQUESTED_BY: ${{ env.REQUESTED_BY || github.actor }}
        run: node .agent/dist/cli/prepare-add-rubrics-proposal.js

      - name: Parse proposal response
        if: always()
        id: response
        env:
          AGENT_EXIT_CODE: ${{ needs['add-rubrics'].outputs.add_rubrics_outcome == 'success' && '0' || '1' }}
          HAS_CHANGES: "true"
          RESPONSE_FILE: ${{ steps.handoff.outputs.response_file }}
          VERIFY_EXIT_CODE: "0"
        run: node .agent/dist/cli/parse-response.js

      - name: Validate rubric proposal
        if: >-
          needs['add-rubrics'].outputs.add_rubrics_outcome == 'success' &&
          needs['add-rubrics'].outputs.rubrics_available == 'true' &&
          steps.handoff.outputs.source_dir != ''
        id: validate_rubrics
        continue-on-error: true
        run: node .agent/dist/cli/rubrics/validate.js --dir "${{ steps.handoff.outputs.source_dir }}"

      - name: Checkout trusted rubric proposal base
        if: >-
          needs['add-rubrics'].outputs.add_rubrics_outcome == 'success' &&
          steps.validate_rubrics.outcome == 'success'
        id: checkout_trusted_rubrics
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUBRICS_REF: ${{ env.RUBRICS_REF }}
          TRUSTED_RUBRICS_PARENT: ${{ runner.temp }}
        run: |
          set -euo pipefail

          trusted_dir="$(mktemp -d "${TRUSTED_RUBRICS_PARENT}/trusted-rubrics.XXXXXX")"
          empty_hooks_dir="${trusted_dir}/.git/sepo-empty-hooks"

          git -C "${trusted_dir}" init
          git -C "${trusted_dir}" config advice.detachedHead false
          git -C "${trusted_dir}" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "${trusted_dir}" fetch --depth=1 origin "refs/heads/${RUBRICS_REF}:refs/remotes/origin/${RUBRICS_REF}"
          git -C "${trusted_dir}" checkout -B "${RUBRICS_REF}" "refs/remotes/origin/${RUBRICS_REF}"
          git -C "${trusted_dir}" remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          mkdir -p "${empty_hooks_dir}"
          git -C "${trusted_dir}" config core.hooksPath "${empty_hooks_dir}"

          printf 'rubrics_dir=%s\n' "${trusted_dir}" >> "${GITHUB_OUTPUT}"

      - name: Prepare trusted rubric commit checkout
        if: >-
          needs['add-rubrics'].outputs.add_rubrics_outcome == 'success' &&
          steps.validate_rubrics.outcome == 'success' &&
          steps.checkout_trusted_rubrics.outcome == 'success'
        id: trusted_rubrics
        env:
          RUBRICS_SOURCE_DIR: ${{ steps.handoff.outputs.source_dir }}
          TRUSTED_RUBRICS_DIR: ${{ steps.checkout_trusted_rubrics.outputs.rubrics_dir }}
        run: node .agent/dist/cli/prepare-add-rubrics-trusted-copy.js

      - name: Validate trusted rubric proposal
        if: >-
          needs['add-rubrics'].outputs.add_rubrics_outcome == 'success' &&
          steps.validate_rubrics.outcome == 'success' &&
          steps.checkout_trusted_rubrics.outcome == 'success' &&
          steps.trusted_rubrics.outcome == 'success'
        id: validate_trusted_rubrics
        continue-on-error: true
        run: node .agent/dist/cli/rubrics/validate.js --dir "${{ steps.checkout_trusted_rubrics.outputs.rubrics_dir }}"

      - name: Commit proposal branch
        if: >-
          needs['add-rubrics'].outputs.add_rubrics_outcome == 'success' &&
          steps.validate_rubrics.outcome == 'success' &&
          steps.validate_trusted_rubrics.outcome == 'success'
        id: commit_rubrics
        env:
          BRANCH: ${{ steps.proposal.outputs.branch }}
          COMMIT_CWD: ${{ steps.checkout_trusted_rubrics.outputs.rubrics_dir }}
          COMMIT_MESSAGE: "${{ steps.response.outputs.commit_message || 'chore(rubrics): propose updates' }}"
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PUSH_LEASE_OID: ${{ steps.proposal.outputs.branch_lease_oid }}
          PUSH_REF: ${{ steps.proposal.outputs.branch }}
        run: node .agent/dist/cli/commit.js

      - name: Create rubric proposal PR
        if: steps.commit_rubrics.outputs.committed == 'true'
        id: pr
        env:
          BASE_BRANCH: ${{ env.RUBRICS_REF }}
          BRANCH: ${{ steps.proposal.outputs.branch }}
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          ISSUE_NUMBER: ${{ env.TARGET_NUMBER }}
          PR_BODY: ${{ steps.response.outputs.pr_body }}
          PR_KIND: add-rubrics
          PR_TITLE: "${{ steps.response.outputs.pr_title || 'Propose rubric updates' }}"
          REQUESTED_BY: ${{ env.REQUESTED_BY || github.actor }}
          RUBRICS_REF: ${{ env.RUBRICS_REF }}
        run: node .agent/dist/cli/create-pr.js

      - name: Prepare add-rubrics summary
        if: always()
        id: add_rubrics_summary
        env:
          BRANCH: ${{ steps.proposal.outputs.branch }}
          BODY_FILE: ${{ runner.temp }}/add-rubrics-summary.md
          PR_OUTCOME: ${{ steps.pr.outcome }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          RESPONSE_FILE: ${{ steps.handoff.outputs.response_file }}
          RUBRICS_AVAILABLE: ${{ needs['add-rubrics'].outputs.rubrics_available }}
          RUBRICS_COMMIT_OUTCOME: ${{ steps.commit_rubrics.outcome }}
          RUBRICS_COMMITTED: ${{ steps.commit_rubrics.outputs.committed }}
          RUBRICS_DIR: ${{ steps.handoff.outputs.source_dir }}
          RUBRICS_REF: ${{ env.RUBRICS_REF }}
          RUBRICS_STEP_OUTCOME: ${{ needs['add-rubrics'].outputs.add_rubrics_outcome }}
          RUBRICS_TRUSTED_SETUP_OUTCOME: ${{ steps.checkout_trusted_rubrics.outcome != 'success' && steps.checkout_trusted_rubrics.outcome || steps.trusted_rubrics.outcome }}
          RUBRICS_TRUSTED_VALIDATION_OUTCOME: ${{ steps.validate_trusted_rubrics.outcome }}
          RUBRICS_VALIDATION_OUTCOME: ${{ steps.validate_rubrics.outcome }}
        run: node .agent/dist/cli/prepare-add-rubrics-proposal-summary.js

      - name: Post add-rubrics summary
        if: always() && steps.add_rubrics_summary.outputs.body_file != ''
        env:
          BODY_FILE: ${{ steps.add_rubrics_summary.outputs.body_file }}
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RESPONSE_KIND: ${{ env.RESPONSE_KIND }}
          TARGET_NUMBER: ${{ env.TARGET_NUMBER }}
          REVIEW_COMMENT_ID: ${{ env.REVIEW_COMMENT_ID }}
          DISCUSSION_ID: ${{ env.DISCUSSION_ID }}
          REPLY_TO_ID: ${{ env.REPLY_TO_ID }}
        run: node .agent/dist/cli/post-response.js
