name: Agent / Rubrics / Add

on:
  workflow_call:
    inputs:
      target_number:
        description: "Target issue, PR, or discussion number"
        required: true
        type: string
      target_url:
        description: "Target URL"
        required: true
        type: string
      target_kind:
        description: "Target kind (issue, pull_request, discussion)"
        required: true
        type: string
      source_kind:
        description: "Trigger source kind"
        required: false
        default: workflow_dispatch
        type: string
      response_kind:
        description: "Response surface kind"
        required: false
        default: issue_comment
        type: string
      review_comment_id:
        description: "Review comment id for reply surfaces"
        required: false
        default: ""
        type: string
      discussion_id:
        description: "Discussion node id for discussion replies"
        required: false
        default: ""
        type: string
      reply_to_id:
        description: "Optional reply-to id for threaded comments"
        required: false
        default: ""
        type: string
      request_text:
        description: "Original user request text"
        required: false
        default: ""
        type: string
      requested_by:
        description: "GitHub login that requested the run"
        required: false
        default: ""
        type: string
      rubrics_ref:
        description: "Rubrics base branch to update directly or target with a proposal PR"
        required: false
        default: agent/rubrics
        type: string
      rubrics_write_mode:
        description: "Rubrics write mode (proposal_pr by default, direct_commit when explicitly requested)"
        required: false
        default: proposal_pr
        type: string
      runs_on:
        description: "Runner labels as JSON array"
        required: false
        default: ""
        type: string
      session_bundle_mode:
        description: "Session bundle mode (auto, always, never)"
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      target_number:
        description: "Target issue, PR, or discussion number"
        required: true
      target_url:
        description: "Target URL"
        required: true
      target_kind:
        description: "Target kind (issue, pull_request, discussion)"
        required: true
      source_kind:
        description: "Trigger source kind"
        required: false
        default: workflow_dispatch
      response_kind:
        description: "Response surface kind"
        required: false
        default: issue_comment
      request_text:
        description: "Original user request text"
        required: false
        default: ""
      requested_by:
        description: "GitHub login that requested the run"
        required: false
        default: ""
      rubrics_ref:
        description: "Rubrics base branch to update directly or target with a proposal PR"
        required: false
        default: agent/rubrics
      rubrics_write_mode:
        description: "Rubrics write mode (proposal_pr or direct_commit)"
        required: false
        default: proposal_pr

permissions:
  contents: write
  discussions: write
  issues: write
  pull-requests: write
  id-token: write # required for GitHub Actions OIDC broker exchange

concurrency:
  group: agent-rubrics-${{ github.repository }}-${{ inputs.rubrics_ref || vars.AGENT_RUBRICS_REF || 'agent/rubrics' }}
  cancel-in-progress: false

jobs:
  add-rubrics:
    if: vars.AGENT_ENABLED != 'false'
    runs-on: ${{ fromJson(inputs.runs_on || vars.AGENT_RUNS_ON || '["ubuntu-latest"]') }}
    env:
      TARGET_NUMBER: ${{ inputs.target_number }}
      TARGET_URL: ${{ inputs.target_url }}
      TARGET_KIND: ${{ inputs.target_kind }}
      SOURCE_KIND: ${{ inputs.source_kind }}
      RESPONSE_KIND: ${{ inputs.response_kind }}
      REQUEST_TEXT: ${{ inputs.request_text }}
      REQUESTED_BY: ${{ inputs.requested_by }}
      RUBRICS_REF: ${{ inputs.rubrics_ref || vars.AGENT_RUBRICS_REF || 'agent/rubrics' }}
      RUBRICS_WRITE_MODE: ${{ inputs.rubrics_write_mode || 'proposal_pr' }}
      REVIEW_COMMENT_ID: ${{ inputs.review_comment_id }}
      DISCUSSION_ID: ${{ inputs.discussion_id }}
      REPLY_TO_ID: ${{ inputs.reply_to_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ github.token }}

      - name: Resolve GitHub auth
        id: auth
        uses: ./.github/actions/resolve-github-auth
        with:
          app_id: ${{ secrets.AGENT_APP_ID }}
          app_private_key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          pat: ${{ secrets.AGENT_PAT }}
          fallback_token: ${{ github.token }}

      - name: Resolve add-rubrics provider
        id: provider
        uses: ./.github/actions/resolve-agent-provider
        with:
          route: add-rubrics
          default_provider: ${{ vars.AGENT_DEFAULT_PROVIDER || 'auto' }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          claude_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Setup agent runtime
        uses: ./.github/actions/setup-agent-runtime
        with:
          install_codex: ${{ steps.provider.outputs.install_codex }}
          install_claude: ${{ steps.provider.outputs.install_claude }}

      - name: Resolve task timeout
        id: task_timeout
        env:
          AGENT_TASK_TIMEOUT_POLICY: ${{ vars.AGENT_TASK_TIMEOUT_POLICY || '' }}
          ROUTE: add-rubrics
        run: node .agent/dist/cli/resolve-task-timeout.js

      - name: Resolve rubrics write mode
        id: write_mode
        env:
          INPUT_RUBRICS_WRITE_MODE: ${{ env.RUBRICS_WRITE_MODE }}
          RUBRICS_BASE_REF: ${{ env.RUBRICS_REF }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail

          mode="${INPUT_RUBRICS_WRITE_MODE:-proposal_pr}"
          case "$mode" in
            proposal_pr|direct_commit) ;;
            *)
              echo "Unsupported rubrics_write_mode '${mode}'. Expected proposal_pr or direct_commit." >&2
              exit 1
              ;;
          esac

          proposal_ref="agent/rubrics-proposal-${GITHUB_RUN_ID}"
          checkout_ref="$RUBRICS_BASE_REF"
          target_ref="$RUBRICS_BASE_REF"
          push_ref=""

          if [ "$mode" = "proposal_pr" ]; then
            target_ref="$proposal_ref"
            auth_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            if git ls-remote --exit-code --heads "$auth_url" "$proposal_ref" >/dev/null 2>&1; then
              checkout_ref="$proposal_ref"
            else
              push_ref="$proposal_ref"
            fi
          fi

          {
            echo "mode=$mode"
            echo "base_ref=$RUBRICS_BASE_REF"
            echo "proposal_ref=$proposal_ref"
            echo "checkout_ref=$checkout_ref"
            echo "target_ref=$target_ref"
            echo "push_ref=$push_ref"
          } >> "$GITHUB_OUTPUT"

      - name: Add or update rubrics from request
        id: add_rubrics
        timeout-minutes: ${{ fromJson(steps.task_timeout.outputs.minutes || '30') }}
        uses: ./.github/actions/run-agent-task
        env:
          RUBRICS_BASE_REF: ${{ steps.write_mode.outputs.base_ref }}
          RUBRICS_PROPOSAL_REF: ${{ steps.write_mode.outputs.proposal_ref }}
          RUBRICS_WRITE_MODE: ${{ steps.write_mode.outputs.mode }}
        with:
          agent: ${{ steps.provider.outputs.provider }}
          github_token: ${{ steps.auth.outputs.token }}
          expose_github_token_to_agent: 'false'
          secondary_github_token: ${{ secrets.AGENT_SECONDARY_GITHUB_TOKEN }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          claude_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          permission_mode: approve-all
          prompt: add-rubrics
          route: add-rubrics
          lane: add-rubrics
          memory_mode_override: 'read-only'
          memory_ref: ${{ vars.AGENT_MEMORY_REF || 'agent/memory' }}
          memory_policy: ${{ vars.AGENT_MEMORY_POLICY || '' }}
          rubrics_mode_override: 'enabled'
          rubrics_ref: ${{ steps.write_mode.outputs.target_ref }}
          rubrics_checkout_ref: ${{ steps.write_mode.outputs.checkout_ref }}
          rubrics_push_ref: ${{ steps.write_mode.outputs.push_ref }}
          rubrics_policy: ${{ vars.AGENT_RUBRICS_POLICY || '' }}
          rubrics_limit: ${{ vars.AGENT_RUBRICS_LIMIT || '10' }}
          session_policy: none
          session_bundle_mode: ${{ inputs.session_bundle_mode || vars.AGENT_SESSION_BUNDLE_MODE || 'auto' }}
          request_text: ${{ env.REQUEST_TEXT }}
          requested_by: ${{ env.REQUESTED_BY || github.actor }}
          source_kind: ${{ env.SOURCE_KIND }}
          target_kind: ${{ env.TARGET_KIND }}
          target_number: ${{ env.TARGET_NUMBER }}
          target_url: ${{ env.TARGET_URL }}
          reasoning_effort: medium
          workflow: agent-add-rubrics.yml

      - name: Check rubric proposal diff
        if: steps.write_mode.outputs.mode == 'proposal_pr'
        id: proposal_diff
        env:
          BASE_BRANCH: ${{ steps.write_mode.outputs.base_ref }}
          BRANCH: ${{ steps.write_mode.outputs.proposal_ref }}
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          auth_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          has_diff=false
          if git ls-remote --exit-code --heads "$auth_url" "$BRANCH" >/dev/null 2>&1; then
            git fetch --no-tags --depth=1 "$auth_url" \
              "+refs/heads/${BASE_BRANCH}:refs/remotes/sepo-rubrics/base" \
              "+refs/heads/${BRANCH}:refs/remotes/sepo-rubrics/proposal"
            if ! git diff --quiet refs/remotes/sepo-rubrics/base refs/remotes/sepo-rubrics/proposal --; then
              has_diff=true
            fi
          fi
          echo "has_diff=$has_diff" >> "$GITHUB_OUTPUT"

      - name: Open rubric proposal PR
        if: >-
          steps.write_mode.outputs.mode == 'proposal_pr' &&
          (
            steps.add_rubrics.outputs.rubrics_committed == 'true' ||
            steps.proposal_diff.outputs.has_diff == 'true'
          )
        id: proposal_pr
        continue-on-error: true
        env:
          BASE_BRANCH: ${{ steps.write_mode.outputs.base_ref }}
          BRANCH: ${{ steps.write_mode.outputs.proposal_ref }}
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RESPONSE_FILE: ${{ steps.add_rubrics.outputs.response_file }}
          REQUESTED_BY: ${{ env.REQUESTED_BY || github.actor }}
          TARGET_KIND: ${{ env.TARGET_KIND }}
          TARGET_NUMBER: ${{ env.TARGET_NUMBER }}
          TARGET_URL: ${{ env.TARGET_URL }}
        run: node .agent/dist/cli/create-rubrics-proposal-pr.js

      - name: Prepare add-rubrics summary
        if: always()
        id: add_rubrics_summary
        env:
          RESPONSE_FILE: ${{ steps.add_rubrics.outputs.response_file }}
          RUBRICS_COMMITTED: ${{ steps.add_rubrics.outputs.rubrics_committed }}
          RUBRICS_VALIDATION_OUTCOME: ${{ steps.add_rubrics.outputs.rubrics_validation_outcome }}
          RUBRICS_COMMIT_OUTCOME: ${{ steps.add_rubrics.outputs.rubrics_commit_outcome }}
          RUBRICS_STEP_OUTCOME: ${{ steps.add_rubrics.outcome }}
          RUBRICS_REF: ${{ steps.write_mode.outputs.base_ref || env.RUBRICS_REF }}
          RUBRICS_TARGET_REF: ${{ steps.write_mode.outputs.target_ref }}
          RUBRICS_PROPOSAL_REF: ${{ steps.write_mode.outputs.proposal_ref }}
          RUBRICS_PROPOSAL_HAS_DIFF: ${{ steps.proposal_diff.outputs.has_diff }}
          RUBRICS_WRITE_MODE: ${{ steps.write_mode.outputs.mode || env.RUBRICS_WRITE_MODE }}
          RUBRIC_PR_ACTION: ${{ steps.proposal_pr.outputs.pr_action }}
          RUBRIC_PR_OUTCOME: ${{ steps.proposal_pr.outcome }}
          RUBRIC_PR_URL: ${{ steps.proposal_pr.outputs.pr_url }}
          TARGET_KIND: ${{ env.TARGET_KIND }}
          TARGET_NUMBER: ${{ env.TARGET_NUMBER }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .agent/dist/cli/prepare-add-rubrics-summary.js

      - name: Post add-rubrics summary
        if: always() && steps.add_rubrics_summary.outputs.body_file != ''
        env:
          BODY_FILE: ${{ steps.add_rubrics_summary.outputs.body_file }}
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RESPONSE_KIND: ${{ env.RESPONSE_KIND }}
          TARGET_NUMBER: ${{ env.TARGET_NUMBER }}
          REVIEW_COMMENT_ID: ${{ env.REVIEW_COMMENT_ID }}
          DISCUSSION_ID: ${{ env.DISCUSSION_ID }}
          REPLY_TO_ID: ${{ env.REPLY_TO_ID }}
        run: node .agent/dist/cli/post-response.js

      - name: Require rubric proposal PR
        if: >-
          always() &&
          steps.write_mode.outputs.mode == 'proposal_pr' &&
          (
            steps.add_rubrics.outputs.rubrics_committed == 'true' ||
            steps.proposal_diff.outputs.has_diff == 'true'
          ) &&
          steps.proposal_pr.outcome == 'failure'
        run: |
          echo "Rubric proposal branch ${{ steps.write_mode.outputs.proposal_ref }} differs from ${{ steps.write_mode.outputs.base_ref }}, but the proposal PR was not opened." >&2
          exit 1
