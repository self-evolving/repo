name: Agent / Cache Seed

# Warms the setup-agent-runtime caches from a trusted push-triggered path
# whenever the runtime inputs change on the default branch. This guarantees
# default-branch cache population regardless of what cache scope
# low-trust-triggered runs are granted, and moves the first-run miss cost
# (npm ci + build + save) off user-facing runs.
#
# Runs on the configured runner pool; caches are keyed per OS/arch/Node, so
# repositories mixing runner types warm the pool this job runs on and let
# other pools self-populate on their first post-change run.

on:
  push:
    paths:
      - ".agent/**"
      - ".github/actions/setup-agent-runtime/**"
  schedule:
    # Aligned with the CLI cache's ISO-week bucket (date -u +%G-%V), which
    # rolls over at Monday 00:00 UTC: low-trust triggers cannot save
    # default-branch caches, so without this a quiet week boundary leaves
    # every hosted run re-downloading the CLI until the next runtime push.
    - cron: "5 0 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: agent-cache-seed-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seed:
    # Only the repository default branch may seed: the job gate covers both
    # push events from other branches (runnerless skips) and manual
    # dispatches selecting a non-default ref, and the checkout pins the
    # default branch explicitly so the executed action code and the saved
    # artifacts always come from the trusted default-branch tree.
    if: >-
      vars.AGENT_ENABLED != 'false' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ${{ fromJson(vars.AGENT_RUNS_ON || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # Only the weekly cron is scheduled activity; push and manual runs
      # warm unconditionally. The gate lets AGENT_SCHEDULE_POLICY disable
      # recurring warming without disabling every Sepo entry point.
      - name: Resolve scheduled disabled gate
        if: github.event_name == 'schedule'
        id: schedule_gate
        uses: ./.github/actions/scheduled-activity-gate
        with:
          github_token: ${{ github.token }}
          schedule_policy: ${{ vars.AGENT_SCHEDULE_POLICY || '' }}
          workflow: agent-cache-seed.yml

      - name: Warm runtime and Claude CLI caches
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.skip != 'true'
        uses: ./.github/actions/setup-agent-runtime
        with:
          cache_mode: full
          # Also warm the Claude CLI cache: on hosted pools this absorbs the
          # weekly and rotation-driven downloads; on self-hosted pools with a
          # preinstalled CLI the need check makes it a no-op.
          install_claude: "true"
